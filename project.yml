name: JEFBrowser

options:
  bundleIdPrefix: ai.jef
  # Castellano: es el idioma de toda la app. Con inglés de base, el WebView
  # pedía las páginas en inglés — el clima llegaba en Fahrenheit y millas, y
  # DuckDuckGo con los botones en inglés.
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  JEFBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Extraction/LICENSE-readability"
      # The shared extraction core ships as a bundle resource, not compiled
      # source. Same two files will be dropped into the Android assets folder.
      - path: Sources/Extraction/Readability.js
        buildPhase: resources
      - path: Sources/Extraction/extract.js
        buildPhase: resources
    # Holds AI_GATEWAY_API_KEY. Generated from .env by Scripts/make-secrets.sh
    # and gitignored. See "Deuda conocida" in the README: shipping a key inside
    # the binary is a development shortcut, not a release plan.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: JEF
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        AIGatewayAPIKey: $(AI_GATEWAY_API_KEY)
        NSLocationWhenInUseUsageDescription: JEF usa el país donde estás para que las búsquedas den resultados de ahí. No guarda ni envía tu ubicación exacta.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.jef.browser
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Probar con VoiceOver de verdad exige un iPhone real: el simulador
        # no corre VoiceOver, solo su inspector.
        DEVELOPMENT_TEAM: 4SXUH7L36N
        CODE_SIGN_STYLE: Automatic
